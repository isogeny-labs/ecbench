name: ecbench build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch pinned crypto source
        run: ./tools/bootstrap_crypto.sh
      - name: Warn when the crypto pin is old
        run: |
          age=$(( ( $(date +%s) - $(git -C deps/crypto log -1 --format=%ct) ) / 86400 ))
          echo "crypto pin is $age days old"
          if (( age > 14 )); then
            echo "::warning title=crypto pin::the pinned crypto commit is $age days old; run the 'crypto pin bump' workflow"
          fi
      - name: Check CLI
        run: cargo check --locked --bin ecbench
      - name: Build release CLI
        run: cargo build --locked --release --bin ecbench
      - name: Check the CLI copy matches the pinned crypto source
        run: |
          diff -u deps/crypto/src/bin/ecbench.rs src/bin/ecbench.rs
          diff -ru deps/crypto/src/bin/ecbench src/bin/ecbench
      - name: Smoke session
        run: ./target/release/ecbench run --spec deps/crypto/docs/ecbench/specs/smoke-prime.json --out "$RUNNER_TEMP/smoke" --cpus none
      - name: Verify smoke session with every run replayed
        run: ./target/release/ecbench verify --dir "$RUNNER_TEMP/smoke" --replay-all --exit-code
      - name: Compare two arms of the smoke session
        run: ./target/release/ecbench compare --dir "$RUNNER_TEMP/smoke" --a rho-neg --b bsgs-neg
